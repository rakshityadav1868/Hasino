apply plugin: 'com.android.application'

/**
 * The host the App Links intent-filter claims, read out of the Capacitor
 * config that `npx cap sync android` just wrote.
 *
 * Not a second place to configure the deployment: HASINO_APP_URL is still the
 * only input, and this reads the file that already holds its answer. A
 * hardcoded host in AndroidManifest.xml would silently disagree with the URL
 * the WebView loads the moment either one moved, and the symptom of that
 * disagreement is Chrome keeping the user — the exact bug this exists to fix.
 *
 * No config yet (a build before the first sync) leaves a host that verifies
 * against nothing, which is inert rather than wrong.
 */
def hasinoAppHost = 'invalid.localhost'
def capConfigFile = file('src/main/assets/capacitor.config.json')
if (capConfigFile.exists()) {
    def serverUrl = new groovy.json.JsonSlurper().parseText(capConfigFile.text)?.server?.url
    if (serverUrl) {
        hasinoAppHost = new URI(serverUrl).host
    }
}
logger.lifecycle("Hasino App Links host: ${hasinoAppHost}")

android {
    namespace = "com.hasino.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hasino.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [hasinoAppHost: hasinoAppHost]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Chrome Custom Tabs. The Google OAuth hop is opened here rather than in the
    // full browser: a tab is bound to the app that opened it, so it follows the
    // hasino:// redirect that ends the sign-in, closes, and puts the app back in
    // front. The full browser does neither. See OAuthTabWebViewClient.java.
    implementation "androidx.browser:browser:1.8.0"
    // Native Google sign-in. Credential Manager draws the Google account sheet
    // over the app and returns a signed ID token, so the login never leaves for
    // a browser. See GoogleAuthPlugin.java.
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
