<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hasino — admin</title>
<link rel="stylesheet" href="/brand.css">
</head>
<body>

<!--
  The operator console gets the same .shell as the salon panel: navigation down
  the side on a desktop, a horizontal scroller under the header on a phone.

  The hashes and the data-nav hooks are unchanged — admin.js's render() finds
  the active link by [data-nav] and maps #/salon/:id back onto "salons" — so
  routing is untouched. #pendingBadge keeps its id and moves into the link as a
  side-count, which is where a queue length belongs: the whole job of this
  panel is the queue, and it was previously legible only on the Salons screen.
-->
<div class="shell">
  <aside class="shell-side">
    <div class="side-brand">
      <a class="lockup" href="#/overview"><span class="wordmark">has<span class="i">i</span>no</span></a>
      <div class="pill bad" style="margin-top:8px">admin</div>
    </div>

    <div class="side-group">Operate</div>
    <a class="side-link" href="#/overview" data-nav="overview"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>Overview</a>
    <!--
      The queue of listing requests, on its own entry. It was reachable only
      by opening Salons and remembering to filter to Pending — an inbox filed
      inside an archive. The badge moves here with it: the count it shows is
      the number of requests waiting, which is what it always meant.
    -->
    <a class="side-link" href="#/requests" data-nav="requests"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><line x1="15" y1="6" x2="18" y2="9"/></svg>Salon requests<span id="pendingBadge"></span></a>
    <a class="side-link" href="#/salons"   data-nav="salons"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9"/><path d="M3 10 4.8 4.6A1 1 0 0 1 5.8 4h12.4a1 1 0 0 1 1 .6L21 10a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/></svg>Salons</a>

    <div class="side-group">Set up</div>
    <a class="side-link" href="#/onboard" data-nav="onboard"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Onboard a salon</a>
    <a class="side-link" href="#/catalog" data-nav="catalog"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>Catalogue</a>

    <div class="side-foot">
      <div class="row" id="whoami" style="gap:8px"></div>
    </div>
  </aside>

  <main class="shell-main" id="view"></main>
</div>

<script type="module" src="/admin.js"></script>
</body>
</html>
