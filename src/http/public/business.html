<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hasino — salon panel</title>
<link rel="stylesheet" href="/brand.css">
</head>
<body>

<!--
  The panel is a dashboard, so it gets a dashboard's shape: navigation down the
  side on a desktop, and the same links as a horizontal scroller pinned under
  the header on a phone (both handled by .shell in brand.css).

  The routes, the hashes and the data-nav hooks are exactly what they were —
  business.js's render() finds the active link by [data-nav] and sets
  aria-current on it, and that still works unchanged. Only the frame moved.
-->
<div class="shell">
  <aside class="shell-side">
    <div class="side-brand">
      <a class="lockup" href="#/today"><span class="wordmark">has<span class="i">i</span>no</span></a>
      <div class="pill brand" style="margin-top:8px">salon panel</div>
    </div>

    <div class="side-group">Overview</div>
    <a class="side-link" href="#/today"    data-nav="today"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg>Today</a>
    <a class="side-link" href="#/insights" data-nav="insights"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="3" y1="21" x2="21" y2="21"/><rect x="5" y="12" width="3.6" height="6" rx="1"/><rect x="10.2" y="8" width="3.6" height="10" rx="1"/><rect x="15.4" y="4" width="3.6" height="14" rx="1"/></svg>Insights</a>
    <a class="side-link" href="#/payouts"  data-nav="payouts"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><circle cx="17" cy="15" r="1.3"/></svg>Money</a>

    <div class="side-group">Manage</div>
    <a class="side-link" href="#/services" data-nav="services"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><line x1="20" y1="4" x2="8.4" y2="15.6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="8.4" y1="8.4" x2="9.9" y2="9.9"/></svg>Services</a>
    <a class="side-link" href="#/timings"  data-nav="timings"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>Timings</a>
    <a class="side-link" href="#/profile"  data-nav="profile"><svg class="icon side-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9"/><path d="M3 10 4.8 4.6A1 1 0 0 1 5.8 4h12.4a1 1 0 0 1 1 .6L21 10a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/></svg>Salon profile</a>

    <!--
      The door out of this panel. It is deliberately empty markup: for a salon
      account there is nothing to put in it — the account *is* a salon, and
      offering a second panel beside the dashboard presents a choice that was
      never theirs to make. business.js fills it only for someone signed out
      or without a salon, who is looking at a panel that is not theirs. See
      initIdentity().

      Who is signed in used to sit here too, at the foot of the sidebar —
      which on a phone meant scrolling the nav strip sideways to find your own
      account. It lives in the header now, top right, where a dashboard puts
      it.
    -->
    <div class="side-foot">
      <div class="row" id="exit" style="gap:8px"></div>
    </div>
  </aside>

  <main class="shell-main">
    <!--
      The dashboard header: what you are looking at on the left, who you are
      on the right. #panelAccount is filled by business.js — an avatar that
      opens the owner's account menu (salon profile, the customer app when it
      applies, and sign out).
    -->
    <header class="panel-header">
      <div class="panel-header-titles">
        <div class="panel-header-eyebrow">Salon panel</div>
        <div class="panel-header-title" id="panelTitle">Today</div>
      </div>
      <div class="panel-header-actions" id="panelAccount"></div>
    </header>

    <!-- Its own slot, outside #view: render() clears #view on every route
         change, and the banner has to outlive that. It used to hang off
         .topbar, which this layout no longer has. -->
    <div id="bannerSlot"></div>
    <div id="view"></div>
  </main>
</div>

<script type="module" src="/business.js"></script>
</body>
</html>
